{{- if .Values.lab.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, labels: {app.kubernetes.io/part-of: dtp}}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgres}}
  template:
    metadata: {labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: dtp}}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false}
          image: {{ .Values.lab.postgresImage | quote }}
          env:
            - {name: POSTGRES_USER, value: dtp_admin}
            - {name: POSTGRES_DB, value: postgres}
            - {name: POSTGRES_PASSWORD_FILE, value: /run/secrets/postgres-admin.password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
          readinessProbe: {exec: {command: [pg_isready, -U, dtp_admin, -d, postgres]}, periodSeconds: 5, timeoutSeconds: 3}
          livenessProbe: {tcpSocket: {port: 5432}, periodSeconds: 10, initialDelaySeconds: 60}
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: socket, mountPath: /var/run/postgresql}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: scripts, mountPath: /docker-entrypoint-initdb.d/10-dtp.sh, subPath: postgres-init.sh, readOnly: true}
      volumes:
        - {name: temporary, emptyDir: {}}
        - {name: socket, emptyDir: {}}
        - {name: secrets, secret: {secretName: {{ .Values.existingSecrets.postgres }}}}
        - {name: scripts, configMap: {name: dtp-bootstrap-scripts, defaultMode: 0555}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], storageClassName: {{ .Values.lab.storageClass }}, resources: {requests: {storage: 2Gi}}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: kafka, labels: {app.kubernetes.io/part-of: dtp}}
spec:
  serviceName: kafka
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: kafka}}
  template:
    metadata: {labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: dtp}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: kafka
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false}
          image: {{ .Values.lab.kafkaImage | quote }}
          args: [/bin/bash, /infra/kafka-start.sh]
          ports: [{containerPort: 9093}]
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: '1', memory: 1Gi}}
          startupProbe: {tcpSocket: {port: 9093}, periodSeconds: 5, failureThreshold: 36}
          readinessProbe: {tcpSocket: {port: 9093}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 9093}, periodSeconds: 10, failureThreshold: 6}
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
            - {name: data, mountPath: /var/lib/kafka/data}
            - {name: logs, mountPath: /opt/kafka/logs}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: scripts, mountPath: /infra, readOnly: true}
      volumes:
        - {name: temporary, emptyDir: {}}
        - {name: logs, emptyDir: {}}
        - {name: secrets, secret: {secretName: {{ .Values.existingSecrets.kafka }}}}
        - {name: scripts, configMap: {name: dtp-bootstrap-scripts, defaultMode: 0555}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], storageClassName: {{ .Values.lab.storageClass }}, resources: {requests: {storage: 1Gi}}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mongo, labels: {app.kubernetes.io/part-of: dtp}}
spec:
  serviceName: mongo
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: mongo}}
  template:
    metadata: {labels: {app.kubernetes.io/name: mongo, app.kubernetes.io/part-of: dtp}}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mongo
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false}
          image: {{ .Values.lab.mongoImage | quote }}
          command: [/bin/bash, /infra/mongo-start.sh]
          env:
            - {name: HOME, value: /tmp}
            - {name: MONGOSH_DISABLE_TELEMETRY, value: "true"}
            - {name: MONGO_INITDB_ROOT_USERNAME, value: dtp_admin}
            - {name: MONGO_INITDB_ROOT_PASSWORD_FILE, value: /run/secrets/mongo-admin.password}
          ports: [{containerPort: 27017}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: '1', memory: 768Mi}}
          startupProbe: {tcpSocket: {port: 27017}, periodSeconds: 5, failureThreshold: 36}
          readinessProbe: {exec: {command: [mongosh, --quiet, /infra/mongo-health.js]}, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {tcpSocket: {port: 27017}, periodSeconds: 10, failureThreshold: 6}
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
            - {name: data, mountPath: /data/db}
            - {name: config, mountPath: /data/configdb}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: scripts, mountPath: /infra, readOnly: true}
      volumes:
        - {name: temporary, emptyDir: {}}
        - {name: config, emptyDir: {}}
        - {name: secrets, secret: {secretName: {{ .Values.existingSecrets.mongo }}}}
        - {name: scripts, configMap: {name: dtp-bootstrap-scripts, defaultMode: 0555}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], storageClassName: {{ .Values.lab.storageClass }}, resources: {requests: {storage: 1Gi}}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis, labels: {app.kubernetes.io/part-of: dtp}}
spec:
  serviceName: redis
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: redis}}
  template:
    metadata: {labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: dtp}}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: redis
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false}
          image: {{ .Values.lab.redisImage | quote }}
          args: [redis-server, /run/secrets/redis.conf]
          ports: [{containerPort: 6379}]
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 500m, memory: 128Mi}}
          readinessProbe: {exec: {command: [/bin/sh, -ec, 'REDISCLI_AUTH="$(cat /run/secrets/redis.password)" redis-cli --no-auth-warning ping | grep -q PONG']}, periodSeconds: 5, timeoutSeconds: 3}
          livenessProbe: {tcpSocket: {port: 6379}, periodSeconds: 10, initialDelaySeconds: 20}
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
            - {name: data, mountPath: /data}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
      volumes:
        - {name: temporary, emptyDir: {}}
        - {name: secrets, secret: {secretName: {{ .Values.existingSecrets.redis }}}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], storageClassName: {{ .Values.lab.storageClass }}, resources: {requests: {storage: 256Mi}}}
{{- end }}

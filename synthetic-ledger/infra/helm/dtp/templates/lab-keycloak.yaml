{{- if .Values.lab.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata: {name: keycloak, labels: {app.kubernetes.io/part-of: dtp}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: keycloak}}
  template:
    metadata: {labels: {app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: dtp}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: keycloak
          image: {{ .Values.lab.keycloakImage | quote }}
          args: [start, --optimized, --http-enabled=true, --import-realm]
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          envFrom: [{secretRef: {name: {{ .Values.existingSecrets.keycloakEnv }}}}]
          env: [{name: JAVA_OPTS_APPEND, value: '-Xms64m -Xmx384m'}]
          ports: [{name: http, containerPort: 8080}, {name: health, containerPort: 9000}]
          resources: {requests: {cpu: 250m, memory: 384Mi}, limits: {cpu: '1', memory: 768Mi}}
          startupProbe: {httpGet: {path: /health/started, port: health}, periodSeconds: 5, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /health/ready, port: health}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: health}, periodSeconds: 10, failureThreshold: 6}
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
            - {name: data, mountPath: /opt/keycloak/data}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: temporary, emptyDir: {}}
        - {name: realm, secret: {secretName: {{ .Values.existingSecrets.realm }}}}
{{- end }}
